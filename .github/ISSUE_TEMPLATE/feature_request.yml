name: Feature request
description: Propose a focused Cybermaps improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Publishing or administration problem
      description: Describe the problem independently of a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and give an example.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - XML or RSS sitemaps
        - llms.txt or Markdown alternates
        - Discovery publications
        - Schema or identity
        - Analytics or diagnostics
        - Reports
        - Developer API
        - Documentation
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note relevant SEO plugins, servers, multisite, multilingual, headless, or privacy constraints.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation.
          required: true
